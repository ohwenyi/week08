apiVersion: v1
kind: ConfigMap
metadata:
  name: koalatech-staging-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  koalatech-staging.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 0,
      "panels": [
        {
          "type": "stat",
          "title": "Running Pods - Staging",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "expr": "sum(kube_pod_status_phase{namespace=\"staging\",phase=\"Running\"})",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "CPU Usage - Staging",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 0
          },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"staging\",container!=\"\"}[5m]))",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Memory Usage - Staging (MiB)",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 0
          },
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{namespace=\"staging\",container!=\"\"}) / 1024 / 1024",
              "refId": "A"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Available Deployment Replicas",
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 8
          },
          "targets": [
            {
              "expr": "sum(kube_deployment_status_replicas_available{namespace=\"staging\"})",
              "refId": "A"
            }
          ]
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": [
        "SIT722",
        "KoalaTech",
        "staging"
      ],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "timezone": "browser",
      "title": "KoalaTech Staging Overview",
      "uid": "koalatech-staging",
      "version": 1
    }